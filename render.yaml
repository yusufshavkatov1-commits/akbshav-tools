services:
  - type: web
    name: akbshav-tools-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /ready
    envVars:
      - key: USER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REQUIRED_CHANNEL
        value: '@akbshav_channel'
      - key: BOT_USERNAME
        value: 'AKBSHAVTOOLS_bot'
      - key: ENVIRONMENT
        value: 'production'
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

  - type: worker
    name: akbshav-tools-jobs
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: USER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REQUIRED_CHANNEL
        value: '@akbshav_channel'
      - key: BOT_USERNAME
        value: 'AKBSHAVTOOLS_bot'
